name: agents-orchestrator

services:
  camunda-data-init:
    image: camunda/camunda:8.10.9
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown -R 1001:1001 /usr/local/camunda/camunda-data && chmod 775 /usr/local/camunda/camunda-data"]
    volumes:
      - camunda-data:/usr/local/camunda/camunda-data
    restart: "no"

  orchestration:
    image: camunda/camunda:8.10.9
    ports:
      - "127.0.0.1:26500:26500"
      - "127.0.0.1:9600:9600"
      - "127.0.0.1:8088:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+PrintFlagsFinal"
      CAMUNDA_SECRETS_STORES_FILE_DEFAULT_PATH: /etc/camunda/secrets
    mem_limit: 1g
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9600 && echo -e \"GET /actuator/health/status HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && head -n 1 <&3'"]
      interval: 1s
      retries: 30
      start_period: 30s
    volumes:
      - camunda:/usr/local/camunda/data
      - camunda-data:/usr/local/camunda/camunda-data
      - ./camunda/driver-lib:/driver-lib:ro
      - ./camunda/secrets:/etc/camunda/secrets:ro
    configs:
      - source: orchestration-config
        target: /usr/local/camunda/config/application.yaml
    depends_on:
      camunda-data-init:
        condition: service_completed_successfully

  worker:
    build: .
    env_file:
      - path: ./camunda/worker.env
        required: false
    environment:
      CAMUNDA_REST_ADDRESS: http://orchestration:8080
      CAMUNDA_GRPC_ADDRESS: http://orchestration:26500
      CAMUNDA_PROJECTS_PATH: /app/projects
      TECH_LEAD_RUNTIME: /runtime
      REPOSITORY_WORKSPACES_PATH: /runtime/workspaces
    volumes:
      - worker-runtime:/runtime
      - ./camunda/codex:/home/worker/.codex
    depends_on:
      orchestration:
        condition: service_healthy

volumes:
  camunda:
  camunda-data:
  worker-runtime:

configs:
  orchestration-config:
    file: ./camunda/configuration/application-h2.yaml
