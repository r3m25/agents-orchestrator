plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
}
group = 'dev.orchestrator'
version = '0.1.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.16')
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'io.camunda:camunda-spring-boot-3-starter:8.10.9'
    implementation 'com.networknt:json-schema-validator:1.5.9'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.camunda:zeebe-bpmn-model:8.10.9'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
processResources {
    from('bpmn') { into 'bpmn' }
}
tasks.register('validateImpact', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.orchestrator.techlead.infrastructure.validation.ValidateImpactResult'
    args providers.gradleProperty('resultFile').getOrElse('.runtime/result.json')
}
springBoot { mainClass = 'dev.orchestrator.techlead.AgentsOrchestratorApplication' }
tasks.register('prepareWorkBranch', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.orchestrator.techlead.infrastructure.cli.PrepareWorkBranchCommand'
    args providers.gradleProperty('projectId').getOrElse(''),
         providers.gradleProperty('component').getOrElse(''),
         providers.gradleProperty('branchName').getOrElse('')
}
